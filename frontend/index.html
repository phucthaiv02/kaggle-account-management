<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaggle Accounts</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #6a737d; --line: #e3e6ea;
    --accent: #20a0ff; --ok: #1a9d5a; --warn: #d98a00; --bad: #d64545;
    --gpu: #20a0ff; --tpu: #8b5cf6; --track: #e9ecef;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171a; --card: #1d2125; --text: #e8eaed; --muted: #9aa3ad; --line: #2c3238; --track: #2c3238; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 7px 14px; border-radius: 8px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h3 { margin: 0; font-size: 16px; }
  .sub { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.between { justify-content: space-between; }
  .meter { margin-top: 14px; }
  .meter .lab { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .track { height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; border-radius: 6px; transition: width .3s; }
  .err { color: var(--bad); font-size: 13px; margin-top: 10px; word-break: break-word; }
  .actions { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button { padding: 4px 10px; font-size: 13px; }
  .login { max-width: 340px; margin: 12vh auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .login h1 { margin: 0 0 8px; font-size: 20px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); width: min(440px, 92vw); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog menu { display: flex; justify-content: flex-end; gap: 8px; padding: 0; margin: 18px 0 0; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .summary { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; color: var(--muted); font-size: 14px; }
  .summary b { color: var(--text); }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; max-height: 300px; font-size: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<section id="loginView" class="login hidden">
  <h1>Kaggle Accounts</h1>
  <div class="sub">Đăng nhập để quản lý tài khoản</div>
  <form id="loginForm">
    <label for="pw">Mật khẩu quản trị</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <div id="loginErr" class="err"></div>
    <div style="margin-top:16px"><button class="primary" style="width:100%">Đăng nhập</button></div>
  </form>
</section>

<div id="appView" class="hidden">
  <header>
    <h1>Kaggle Accounts</h1>
    <button id="btnRefreshAll">Làm mới tất cả</button>
    <button id="btnAdd" class="primary">+ Thêm tài khoản</button>
    <button id="btnLogout">Đăng xuất</button>
  </header>
  <main>
    <div id="summary" class="summary"></div>
    <div id="list" class="grid"></div>
    <div id="empty" class="empty hidden">Chưa có tài khoản nào. Bấm "Thêm tài khoản" để bắt đầu.</div>
  </main>
</div>

<dialog id="dlgAccount">
  <form method="dialog" id="accForm">
    <h3 id="dlgTitle" style="margin:0 0 4px">Thêm tài khoản</h3>
    <label for="fName">Tên gợi nhớ</label>
    <input id="fName" required maxlength="80">
    <label for="fToken">Access token Kaggle <span id="tokenHint"></span></label>
    <input id="fToken" type="password" autocomplete="off">
    <label for="fUser">Username Kaggle (chỉ cần với khóa API kiểu cũ, có thể bỏ trống)</label>
    <input id="fUser" autocomplete="off">
    <label for="fNote">Ghi chú</label>
    <textarea id="fNote" rows="2"></textarea>
    <div id="accErr" class="err"></div>
    <menu>
      <button type="button" id="accCancel">Hủy</button>
      <button class="primary" id="accSave" value="save">Lưu</button>
    </menu>
  </form>
</dialog>

<dialog id="dlgInfo">
  <h3 id="infoTitle" style="margin:0 0 10px"></h3>
  <pre id="infoBody"></pre>
  <menu><button id="infoClose">Đóng</button></menu>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
let accounts = [];
let editingId = null;

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, {
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 401 && path !== "/login") { showLogin(); throw new Error("Chưa đăng nhập"); }
  if (r.status === 204) return null;
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ("Lỗi " + r.status));
  return data;
}

function showLogin() { $("#appView").classList.add("hidden"); $("#loginView").classList.remove("hidden"); }
function showApp() { $("#loginView").classList.add("hidden"); $("#appView").classList.remove("hidden"); }

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginErr").textContent = "";
  try { await api("/login", { method: "POST", body: { password: $("#pw").value } }); $("#pw").value = ""; await load(); }
  catch (err) { $("#loginErr").textContent = err.message; }
});
$("#btnLogout").onclick = async () => { await api("/logout", { method: "POST" }).catch(() => {}); showLogin(); };

function fmtH(v) { return v == null ? "–" : v.toFixed(2).replace(/\.?0+$/, "") + "h"; }
function ago(ts) {
  if (!ts) return "chưa kiểm tra";
  const d = new Date(ts.replace(" ", "T") + "Z"); const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "vừa xong"; if (m < 60) return m + " phút trước";
  if (m < 1440) return Math.round(m / 60) + " giờ trước"; return Math.round(m / 1440) + " ngày trước";
}

function meter(label, used, total, color) {
  const wrap = document.createElement("div"); wrap.className = "meter";
  const lab = document.createElement("div"); lab.className = "lab";
  const l = document.createElement("span"); l.textContent = label;
  const r = document.createElement("span");
  const track = document.createElement("div"); track.className = "track";
  const fill = document.createElement("div"); fill.className = "fill";
  if (used == null || total == null || total <= 0) { r.textContent = "không có dữ liệu"; fill.style.width = "0"; }
  else {
    const remain = Math.max(total - used, 0), pct = Math.min(used / total * 100, 100);
    r.textContent = `còn ${fmtH(remain)} / ${fmtH(total)}`;
    fill.style.width = pct + "%";
    fill.style.background = remain / total < 0.1 ? "var(--bad)" : remain / total < 0.25 ? "var(--warn)" : color;
  }
  lab.append(l, r); track.append(fill); wrap.append(lab, track); return wrap;
}

function btn(text, onclick, cls = "") { const b = document.createElement("button"); b.textContent = text; b.className = cls; b.onclick = onclick; return b; }

function render() {
  const list = $("#list"); list.replaceChildren();
  $("#empty").classList.toggle("hidden", accounts.length > 0);
  let gpuLeft = 0, tpuLeft = 0, errs = 0;
  for (const a of accounts) {
    const q = a.quota; if (q) { gpuLeft += Math.max((q.gpu_total ?? 0) - (q.gpu_used ?? 0), 0); tpuLeft += Math.max((q.tpu_total ?? 0) - (q.tpu_used ?? 0), 0); }
    if (a.last_error) errs++;
    const c = document.createElement("div"); c.className = "card";
    const top = document.createElement("div"); top.className = "row between";
    const h = document.createElement("h3"); h.textContent = a.name;
    const when = document.createElement("span"); when.className = "sub"; when.textContent = ago(a.last_checked);
    top.append(h, when); c.append(top);
    if (a.username) { const u = document.createElement("div"); u.className = "sub"; u.textContent = "@" + a.username; c.append(u); }
    if (a.note) { const n = document.createElement("div"); n.className = "sub"; n.textContent = a.note; c.append(n); }
    c.append(meter("GPU", q?.gpu_used, q?.gpu_total, "var(--gpu)"), meter("TPU", q?.tpu_used, q?.tpu_total, "var(--tpu)"));
    if (a.last_error) { const e = document.createElement("div"); e.className = "err"; e.textContent = a.last_error; c.append(e); }
    const act = document.createElement("div"); act.className = "actions";
    act.append(
      btn("Làm mới", async (ev) => { ev.target.disabled = true; try { await api(`/accounts/${a.id}/refresh`, { method: "POST" }); } finally { await load(); } }),
      btn("Notebook", () => showKernels(a)),
      btn("Lịch sử", () => showHistory(a)),
      btn("Sửa", () => openEdit(a)),
      btn("Xóa", async () => { if (confirm(`Xóa tài khoản "${a.name}"?`)) { await api(`/accounts/${a.id}`, { method: "DELETE" }); load(); } }, "danger"),
    );
    c.append(act); list.append(c);
  }
  const s = $("#summary"); s.replaceChildren();
  for (const [k, v] of [["Tài khoản", accounts.length], ["GPU còn lại (tổng)", fmtH(gpuLeft)], ["TPU còn lại (tổng)", fmtH(tpuLeft)], ["Lỗi", errs]]) {
    const sp = document.createElement("span"); sp.append(k + ": "); const b = document.createElement("b"); b.textContent = v; sp.append(b); s.append(sp);
  }
}

async function load() {
  try { accounts = await api("/accounts"); showApp(); render(); } catch (e) { /* đã chuyển về đăng nhập */ }
}

// --- thêm / sửa ---
function openAdd() {
  editingId = null; $("#dlgTitle").textContent = "Thêm tài khoản";
  for (const id of ["#fName", "#fToken", "#fUser", "#fNote"]) $(id).value = "";
  $("#fToken").required = true; $("#tokenHint").textContent = ""; $("#accErr").textContent = "";
  $("#dlgAccount").showModal();
}
function openEdit(a) {
  editingId = a.id; $("#dlgTitle").textContent = "Sửa tài khoản";
  $("#fName").value = a.name; $("#fToken").value = ""; $("#fUser").value = a.username || ""; $("#fNote").value = a.note || "";
  $("#fToken").required = false; $("#tokenHint").textContent = "(để trống nếu không đổi)"; $("#accErr").textContent = "";
  $("#dlgAccount").showModal();
}
$("#btnAdd").onclick = openAdd;
$("#accCancel").onclick = () => $("#dlgAccount").close();
$("#accForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = { name: $("#fName").value, username: $("#fUser").value, note: $("#fNote").value };
  if ($("#fToken").value) body.token = $("#fToken").value;
  $("#accSave").disabled = true; $("#accErr").textContent = "";
  try {
    const res = editingId == null
      ? await api("/accounts", { method: "POST", body })
      : await api(`/accounts/${editingId}`, { method: "PATCH", body });
    $("#dlgAccount").close(); await load();
    if (res.check && !res.check.ok) alert("Đã lưu, nhưng kiểm tra token thất bại:\n" + res.check.error);
  } catch (err) { $("#accErr").textContent = err.message; }
  finally { $("#accSave").disabled = false; }
});

// --- thông tin phụ ---
function info(title, text) { $("#infoTitle").textContent = title; $("#infoBody").textContent = text; $("#dlgInfo").showModal(); }
$("#infoClose").onclick = () => $("#dlgInfo").close();
async function showKernels(a) {
  try { const r = await api(`/accounts/${a.id}/kernels`); info(`Notebook của ${a.name}`, r.csv || "(trống)"); }
  catch (e) { info(`Notebook của ${a.name}`, "Lỗi: " + e.message); }
}
async function showHistory(a) {
  const h = await api(`/accounts/${a.id}/history`);
  const lines = h.slice(-40).reverse().map((r) => `${r.ts}  GPU ${fmtH(r.gpu_used)}/${fmtH(r.gpu_total)}  TPU ${fmtH(r.tpu_used)}/${fmtH(r.tpu_total)}`);
  info(`Lịch sử quota: ${a.name}`, lines.join("\n") || "(chưa có dữ liệu)");
}

$("#btnRefreshAll").onclick = async (ev) => {
  ev.target.disabled = true; ev.target.textContent = "Đang làm mới…";
  try { await api("/refresh-all", { method: "POST" }); } finally { ev.target.disabled = false; ev.target.textContent = "Làm mới tất cả"; await load(); }
};

setInterval(() => { if (!$("#appView").classList.contains("hidden")) load(); }, 60000);
load();
</script>
</body>
</html>
